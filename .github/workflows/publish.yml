name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      # There is deliberately no Python step here. Executed output is committed
      # in _freeze/, so the renderer never runs code on CI — which keeps builds
      # fast and stops a library upgrade on the runner from changing published
      # results. Re-execution happens locally, on `quarto render`.
      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
